<html>
    <head>
        <title>Listas ordenadas</title>
    </head>
    <body>
        <ol>
            <li>Papas</li>
            <li>Quezo</li>
            <li>Tomate</li>
            <li>Crema</li>
        </ol>

        <ol start="10">
            <li>Papas</li>
            <li>Quezo</li>
            <li>Tomates</li>
            <li>Crema</li>
        </ol>

        <ol type="i">
            <li>Papas</li>
            <li>Quezo</li>
            <li>Tomates</li>
            <li>Crema</li>
        </ol>

        <ol reversed>
            <li>Papas</li>
            <li>Quezo</li>
            <li>Tomates</li>
            <li>Crema</li>
        </ol>
    </body>
</html>
